# CI projektu sklep-agentow — wersja startowa (stack: statyczny HTML + Cloudflare Worker).
# Szablon warsztatowy (PHP/WP) przycięty 2026-08-17: phpcs/phpstan/phpunit/plugin-check
# nie dotyczą tego stacku. Bramki testowe JS dojdą osobnym PR-em razem z kością
# (wtedy też rośnie manifest-bramek.txt — osobny PR, czyta Dzidek).
#
# ⛔ BRANCH PROTECTION na main = jedyna rzecz, która realnie zatrzymuje scalenie:
#    wymagane statusy: actionlint + manifest · PR obowiązkowy · zakaz force-push.
name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint samych plików CI — łapie literówki YAML zanim cokolwiek ruszy
  # (własna blizna: „CI YAML dwukropek w nazwie kroku").
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1

  # Strażnik strażników: quality.yml musi zgadzać się z manifestem bramek
  # (job zniknął / continue-on-error / furtka if: = czerwone).
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest bramek zgodny z workflow
        run: bash narzedzia-qa/sprawdz-manifest.sh
