# CI projektu sklep-agentow — stack po piwocie D16: 3 wtyczki WordPressa (PHP 8.1+, stack WP 7.0.4/PHP 8.4).
# Bramki (plan §7): actionlint + manifest + php-lint + phpcs (WPCS) + phpstan (level 5) + gitleaks.
# Testy przelotu E2E biegają na żywym stacku warsztatu (testy/e2e/), nie tutaj — CI nie ma WP+Stripe.
#
# ⛔ PRAWDA O BRAMCE (zmierzone 17.08): repo PRYWATNE na darmowym koncie = GitHub
#    NIE UDOSTĘPNIA branch protection ani rulesetów (API: 403 „Upgrade to Pro").
#    Czerwone CI NIE blokuje scalenia technicznie — trzyma je DYSCYPLINA CYKLU:
#    scalamy wyłącznie `gh pr merge` PO zielonych bramkach; bezpośredni
#    push na main blokuje wersjonowany hook `.githooks/pre-push` — UWAGA: działa
#    dopiero po JEDNORAZOWEJ aktywacji w każdym klonie:
#        git config core.hooksPath .githooks
#    (świeży klon bez tej komendy NIE ma ochrony; świadome obejście: --no-verify).
#    Twarda bramka wróci, gdy repo będzie publiczne albo konto Pro (decyzja właściciela).
#
# 2026-08-20: SZEŚĆ ZADAŃ ZBITE W JEDNO. Powód policzalny: GitHub nalicza każde
# zadanie osobno i zaokrągla w górę do pełnej minuty, więc sześć zadań po ~7 s
# kosztowało SZEŚĆ MINUT za czterdzieści sekund liczenia. Tego samego dnia konto
# wyczerpało minuty i wszystkie bramki padły z zerem kroków — stąd ta zmiana.
# Bramki biegną teraz po kolei w narzedzia-qa/bramki.sh (ta sama kolejność co
# w sześciu zadaniach), a ten plik tylko stawia środowisko i woła skrypt.
#
# ⛔ CZEGO PILNOWAĆ PO TEJ ZMIANIE: sześć zielonych zadań było widać na liście —
# jedno zadanie, które po cichu przestało wołać phpstana, wygląda równie zielono.
# Dlatego skrypt LICZY wykonane bramki, wypisuje ich liczbę i PADA poniżej progu,
# a narzedzia-qa/sprawdz-manifest.sh pilnuje, że rejestr bramek w skrypcie zgadza
# się z .github/manifest-bramek.txt. Sam manifest pozostaje nietknięty.
name: Quality

on:
  pull_request:
  push:
    branches: [main]

# Nowy commit w tej samej gałęzi anuluje poprzedni przebieg — trzy pchnięcia
# pod rząd kosztują jedną kontrolę, nie trzy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # JEDNO zadanie na wszystkie bramki. Powód z 20.08 (zaokrąglanie każdego zadania
  # do pełnej minuty) wraca w całości, bo od 5.09 znów płacimy minutami GitHuba.
  bramki:
    # ⛔ 5.09 (DECYZJE.md D41): WYKONAWCA GITHUBA zamiast własnego. Własny (Hetzner, 2 vCPU)
    # brał JEDNO zadanie naraz, więc bramki i recenzja stały w jednej kolejce: zmierzone
    # 12 min + 12 min PO KOLEI = 24 min na pchnięcie, z kolejką za `main` 40+. Tu 20 zadań
    # równolegle (limit planu Free), a serwer wraca do roboty warsztatu. Koszt: 2000 min/mies.
    # w planie Free ≈ 80 pchnięć, powyżej płatne — tempo pchnięć to teraz też pieniądze.
    # ⛔ Własnego wykonawcy NIE podpinać z powrotem bez decyzji właściciela (B-6: kod z cudzej
    # gałęzi na naszej maszynie).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # Obraz GitHuba MA Dockera, ale NIE MA kontenera bazy stosu warsztatu (`strona_wp_db`),
      # więc bramka `golden` i próby stawiające stos nie mają gdzie wystartować. Bez tej
      # deklaracji widziałyby Dockera i świeciły CZERWONO jako „wada stanowiska” na każdym PR-ze.
      # Pominięcie jest JAWNE (log + podsumowanie), policzone i pod sufitem — dokładnie tak,
      # jak było na koncie `ciuser` bez Dockera. Jedyne miejsce, które to ustawia.
      BEZ_STOSU_WP: "1"
    steps:
      # Pełna historia: gitleaks skanuje commity, nie tylko drzewo robocze.
      # ⛔ PRZYPIETE DO SUMY COMMITA, nie do ruchomego taga — patrz komentarz
      # w recenzent.yml. Podnoszenie: Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 5.09 (D41): `setup-php` WRACA, bo wraca środowisko, w którym działa — wykonawca
      # GitHuba ma `sudo`, a jego obraz (`ubuntu-24.04`) niesie PHP 8.3, nie 8.4 (README obrazu:
      # „PHP 8.3.6”). Kontrola wersji niżej ZOSTAJE jako bramka: gdyby akcja cicho postawiła
      # inną wersję, pada ona, nie phpstan gdzieś dalej. Przypięte do sumy commita jak reszta.
      - name: PHP 8.4 (wykonawca GitHuba)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2

      # ⛔ HISTORIA: `setup-php` był USUNIĘTY 1.09 — na WŁASNYM wykonawcy ZAWIESZAŁ CAŁE CI.
      #    (Zostawiam, bo to mierzona pułapka na wypadek powrotu własnego wykonawcy.)
      #
      #    Działała, dopóki wykonawca chodził jako administrator: przy pierwszym
      #    przebiegu (20.08) doinstalowała 167 pakietów systemowych i przestawiła
      #    systemowe `php` z 8.3 na 8.4, więc kolejne przebiegi trwały sekundę.
      #    Po przeniesieniu wykonawcy na konto `ciuser` (znalezisko B-3, 31.08)
      #    nie może zrobić ani jednego, ani drugiego: woła `sudo`, dostaje
      #    odmowę i PONAWIA BEZ KOŃCA. Zmierzone 1.09: krok stał 40 minut przy
      #    zerowym procesorze, wypisując dwie linie na sekundę
      #    („sudo: a password is required"), przebieg nie kończył się nigdy
      #    i blokował jedynego wykonawcę. Od 31.08 do 1.09 ŻADEN przebieg
      #    nie zakończył się sukcesem.
      #
      #    Krok był i tak zbędny: PHP 8.4.24 i Composer 2.10.3 stoją systemowo
      #    i są widoczne dla `ciuser` (zmierzone). Zamiast instalatora zostaje
      #    BRAMKA, która pada, gdy wersja nie jest tą, na której liczymy —
      #    to ta sama gwarancja co wcześniej, bez uprawnień administratora.
      #    ⛔ Nie przywracać `setup-php` bez nadania `ciuser` praw sudo, a tego
      #    robić nie wolno: to unieważnia całą naprawę B-3.
      - name: Kontrola srodowiska PHP (bramka wersji)
        run: |
          php -v | head -1
          WERSJA=$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')
          echo "wykryta wersja PHP: $WERSJA"
          if [ "$WERSJA" != "8.4" ]; then
            echo "BLAD: bramki wymagaja PHP 8.4, a systemowe to $WERSJA" >&2
            exit 1
          fi
          command -v composer >/dev/null || { echo "BLAD: brak composera w PATH" >&2; exit 1; }
          composer --version

      # Było w dwóch starych zadaniach (phpcs, phpstan) — tu raz.
      - name: Zaleznosci QA
        run: composer install --no-interaction --no-progress --no-scripts

      # ⛔ BEZ `if:` na tym kroku i bez `continue-on-error` — bramka, która może
      # nie wystartować albo nie zablokować, nie jest bramką. Pomijanie bramek
      # PHP przy zmianach czysto tekstowych dzieje się WEWNĄTRZ skryptu, jest
      # wypisywane i policzone.
      - name: Bramki jakosci
        run: bash narzedzia-qa/bramki.sh

  # ⛔ 5.09 (D41 c.d., Dzidek: „więcej czekania na bramki niż roboty”): PRZELOT PRÓB WARUNKOWY
  # I RÓWNOLEGŁY. Zmierzone na #285: bramki 112 s, przelot prób 718 s, recenzja 703 s. Przelot
  # mierzy NARZĘDZIA (czy bramki widzą podłożoną wadę), nie produkt — dla PR-a, który nie rusza
  # `narzedzia-qa/` ani `.github/`, narzędzia są dokładnie te same co na `main`, gdzie przelot
  # biegnie ZAWSZE. Dlatego: (1) PR produktowy = bramki ‖ recenzja, czekanie ~12 min zamiast 26;
  # (2) gdy przelot ma biec, biegnie w TRZECH odłamkach naraz (nazwane w samym przelocie, próba
  # kontrolna pilnuje, że ich suma to pełna lista) — czekanie ≈ najdłuższa próba (~10 min).
  # ⛔ BEZ `if:` NA ZADANIU ANI KROKU — bramka `manifest` (sprawdz-manifest.sh) tego zabrania i ma
  # rację: zadanie warunkowe potrafi cicho nie wystartować. Decyzja „czy przelot ma biec” zapada
  # WEWNĄTRZ kroku, jest WYPISANA z listą zmienionych plików i powodem — dokładnie jak bramki.sh
  # pomija bramki PHP przy zmianach tekstowych (wewnątrz skryptu, wypisane, policzone).
  # Koszt: trzy zadania startują zawsze (checkout + PHP ≈ 20 s każde, zaokrąglane do minuty), więc
  # PR produktowy płaci ~3 min za pominięty przelot — świadomie, za bramkę bez furtki.
  proby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odlamek: [bramki, poswiadczenia, reszta]
    env:
      BEZ_STOSU_WP: "1"            # jak w zadaniu `bramki` — obraz ma Dockera, stosu WP nie ma
      PRZELOT_ODLAMEK: ${{ matrix.odlamek }}
      BAZA: ${{ github.base_ref }}
      ZDARZENIE: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: PHP 8.4 (wykonawca GitHuba)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Zaleznosci QA
        run: composer install --no-interaction --no-progress --no-scripts

      # ⛔ PROBY KONTROLNE BRAMEK — znalezisko I-6 (31.08). Do dzis chodzily
      # WYLACZNIE recznie i w bramce wydania, wiec regres w SAMEJ BRAMCE byl
      # niewidzialny miedzy przelotami: bramka mogla przestac cokolwiek widziec,
      # a CI dalej swiecilo na zielono. Bramka, ktorej nikt nie sprawdza, jest
      # bramka na slowo honoru.
      #
      # ⛔ Kod 2 znaczy „nie zmierzone" (brak warunkow wstepnych, np. paczki
      # albo stosu WP), a nie „zdane". Takie przypadki sa POLICZONE i WYPISANE
      # z nazwy — cicha rezygnacja z kontroli wyglada dokladnie jak kontrola zdana.
      # ⛔ Wolamy ISTNIEJACE narzedzie, nie wlasna petle. Pierwsza wersja tego kroku
      # (31.08) przepisywala od zera to, co `proby-kontrolne-przelot.sh` robi od
      # PR #198 — i robila GORZEJ: bez listy prob swiadomie pomijanych z powodem
      # (jedna z nich DEINSTALUJE wtyczke ze stosu) i bez logu ze znacznikiem commita.
      # Klasa: „sprawdz, jak zrobiono to samo obok, ZANIM napiszesz swoje".
      #
      # Log idzie do katalogu tymczasowego, zeby krok nie brudzil drzewa roboczego —
      # przelot sam odmawia pracy na brudnym drzewie i mialby prawo odmowic sobie.
      #
      # ⛔ ZAKRES `narzedzia-qa` JEST CELOWY I ZMIERZONY. Przelot po całym repo bierze
      # WSZYSTKIE próby kontrolne repozytorium — liczby NIE podaję, bo starzeje się szybciej
      # niż jedna kolejka PR-ów — w dwóch rundach z rzędu liczba zmieniała się po scaleniu
      # jednej gałęzi. Policz komendą niżej. Spora część tych z `testy/` wymaga
      # żywego stosu WordPressa, a manifest bramek mówi wprost, że w CI nie ma WP+Stripe.
      # Bez zawężenia ten krok padałby zawsze, na porażkach, które nie są wadami kodu. Próby produktu
      # chodzą w przelocie BEZ zakresu, uruchamianym RĘCZNIE przed wydaniem — tam stos stoi.
      # ⛔ LICZ KOMENDĄ, NIE Z PAMIĘCI — te liczby starzeją się przy każdej nowej próbie:
      #     find . -name '*proba-kontrolna*.sh' -not -path './.git/*' | wc -l
      #     find narzedzia-qa -name '*proba-kontrolna*.sh' | wc -l
      # Poprzednia wersja mówiła `38` — policz komendą wyżej, ile jest dziś (recenzja #274
      # r13 WAŻNA 3; r17 WAŻNA 1 — człon różnicy skreślony, bo starzał się razem z liczbą).
      # Ile z nich to testy PRODUKTU — liczby NIE podaję ANI CYFRĄ, ANI SŁOWNIE: nie mam
      # definicji, po której da się to policzyć bez uruchomienia przelotu na żywym stosie.
      # Zmyślona liczba w uzasadnieniu decyzji jest gorsza niż jej brak (recenzja #274 r15,
      # WAŻNA 2 — poprzednia wersja odmawiała podania liczby i dwie linie niżej podawała
      # ją słownie; sweep objął wtedy ZAPIS cyfrą, nie POJĘCIE).
      # ⛔ `k7-koniec.sh` tego przelotu NIE URUCHAMIA: czyta jego log, sprawdza znacznik
      # `WYGENEROWANE-PRZEZ:` i świeżość względem commitu, a przy braku KAŻE go uruchomić.
      # (Odsyłam po TREŚCI, nie po numerze linii — numery, które tu stały, ruszały się już
      # trzykrotnie, za każdym razem przez commit tej samej gałęzi.) Poprzednie zdanie mówiło
      # „k7-koniec woła przelot” i obiecywało automat, którego nie ma (recenzja #274 r12,
      # WAŻNA 1 — ta sama nieprawda stała też w narzedzia-qa/linia-bazowa.sh, w komentarzu
      # „GDZIE TEN STRAZNIK NAPRAWDE BIEGNIE”, w członie o ręcznym spuście; odsyłam po
      # TREŚCI, bo numer linii przesuwa się przy każdej poprawce — recenzja #274 r15, WAŻNA 3).
      - name: Proby kontrolne bramek (odlamek ${{ matrix.odlamek }})
        run: |
          # Decyzja WEWNATRZ kroku (bez if:), wypisana — patrz komentarz przy zadaniu `proby`.
          if [ "$ZDARZENIE" != push ]; then
            ZMIENIONE=$(git diff --name-only "origin/$BAZA" HEAD)
            if ! printf '%s\n' "$ZMIENIONE" | grep -qE '^(narzedzia-qa|\.github)/'; then
              echo "PRZELOT PROB (odlamek $PRZELOT_ODLAMEK): POMINIETY JAWNIE — zmiana nie dotyka narzedzia-qa/ ani .github/;"
              echo "  proby mierza NARZEDZIA, a te sa identyczne z main, gdzie przelot biegnie zawsze. Zmienione pliki:"
              printf '  %s\n' $ZMIENIONE
              exit 0
            fi
            echo "PRZELOT PROB (odlamek $PRZELOT_ODLAMEK): BIEGNIE — zmiana dotyka narzedzia-qa/ albo .github/"
          else
            echo "PRZELOT PROB (odlamek $PRZELOT_ODLAMEK): BIEGNIE — push na main, zawsze"
          fi
          bash narzedzia-qa/proby-kontrolne-przelot.sh "${RUNNER_TEMP}/PROBY-KONTROLNE-${PRZELOT_ODLAMEK}.log" narzedzia-qa
