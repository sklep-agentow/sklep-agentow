# Recenzent Claude na każdy PR (wzór: oficjalny przykład pr-review-comprehensive
# z anthropics/claude-code-action). Wymaga sekretu CLAUDE_CODE_OAUTH_TOKEN w repo.
#
# 2026-08-17: powrót do CZYSTEJ udokumentowanej konfiguracji po nocy 8 prób
# (historia: Issue #9). Zmiany względem nocnej wersji:
#  - usunięte obejścia (ręczny plik poświadczeń, pin CLI, env-dublet) — żadne
#    nie zmieniło objawu, a zaciemniają diagnozę,
#  - `show_full_output: true` — akcja DOMYŚLNIE ukrywa treść błędu w logu
#    (base-action sanitizeSdkOutput; „full output hidden for security"),
#  - permissions: dodane `actions: read` — bez niego 403 na GET /actions/runs
#    (nie zabija runa, ale wyłącza serwer MCP github_ci dla track_progress),
#  - krok upload-artifact (if: always()) zachowuje pełny wynik CLI — treść
#    błędu, której okrojony log nie pokazuje.
#
# 2026-08-20: briefing recenzenta WYPROWADZONY do .github/RECENZENT-BRIEFING.md.
# Powód: ten plik jest wspólny dla wszystkich builderów — dopóki 60 linii
# instrukcji siedziało w środku, każda poprawka recenzenta ruszała plik wspólny
# i robiła konflikt u każdego, kto miał otwartą gałąź. Tu zostaje SAMA mechanika
# (co uruchomić i z jakimi uprawnieniami), treść recenzji mieszka w briefingu.
# Przy okazji recenzent dostał to, czego mu brakowało: pełną historię
# (fetch-depth: 0 — dwa razy sam się skarżył, że nie może zweryfikować historii),
# `vendor/` przed startem (żeby URUCHAMIAŁ bramki, nie czytał ich) oraz jawną
# listę --allowedTools na te bramki i na pobieranie stron (zasada „tylko źródła
# oficjalne" jest w briefingu).
#
# ⛔ WALIDACJA WORKFLOW: bez `github_token` PR zmieniający TEN plik NIE JEST
# recenzowany. Akcja odmawia startu, gdy plik workflow różni się od wersji
# z gałęzi domyślnej („Workflow validation failed. The workflow file must exist
# and have identical content to the version on the repository's default branch";
# źródło akcji: src/github/token.ts — „expected [...] on PRs with workflow
# changes [...] your workflow will begin working once you merge your PR").
# Krok kończy się ZIELONY, ale recenzji NIE MA — PR na ten plik wygląda wtedy
# na sprawdzony, a nie jest. Zmierzone na PR #90: krok trwał 4 s, artefakt
# z wyjściem CLI PUSTY (CLI w ogóle nie wystartowało).
# Istnieje jedno wyjście: wypełnienie wejścia `github_token` wbudowanym tokenem
# przebiegu pomija wymianę OIDC → app token, a wraz z nią tę walidację
# (OVERRIDE_GITHUB_TOKEN wychodzi z setupGitHubToken() PRZED wymianą) — wtedy PR
# na ten plik JEST recenzowany. Cena: znika zabezpieczenie przed PR-em, który
# przerabia workflow pod siebie. ⚠️ NIE ROBIMY tego bez decyzji koordynatorki;
# dopóki jej nie ma, zmiany tutaj weryfikuje się PO scaleniu, na następnym PR.
#
# Testy w `testy/*.php` NIE sa zwyklymi skryptami PHP: kazdy zaczyna sie od
# `WP_PLUGIN_DIR` i `require` plikow wtyczki, wiec `php testy/X.php` konczy sie
# `Undefined constant "WP_PLUGIN_DIR"` (EXIT=255). Uruchamia je wylacznie wp-cli
# WEWNATRZ kontenera (`docker cp` + `wp eval-file`). Dlatego NIE ma tu wzorca
# `Bash(php testy/:*)` — otwieralby prawo do polecenia, ktore i tak zawsze pada —
# ani `Bash(docker exec:*)`, ktory oddalby cala maszyne. Jest `test-php.sh`:
# jedna nazwana operacja, nazwa testu przez twardy wzorzec [a-z0-9-], katalog
# `testy/` wpisany w skrypcie, `wp eval-file` (plik z repozytorium) zamiast
# `wp eval` (kod z wiersza polecen). Wzorzec pilnuje `test-php-proba-kontrolna.sh`.
#
# Uwaga do --allowedTools: akcja dokleja nasze argumenty PO swoich, a ta flaga
# jest AKUMULUJĄCA (base-action/src/parse-sdk-options.ts, ACCUMULATING_FLAGS;
# test „should accumulate multiple --allowedTools flags from claudeArgs"
# symuluje dokładnie nasz przypadek), więc nasza lista DOKŁADA uprawnienia,
# a nie kasuje narzędzi akcji. Mimo to wymieniamy JAWNIE narzędzia domyślne
# (Read/Glob/Grep/LS + mcp__github_comment__update_claude_comment +
# mcp__github_ci__*): kosztuje nic, a uniezależnia nas od tego, czy akumulacja
# kiedyś się zmieni — bez `Read` recenzent nie przeczyta briefingu, bez
# mcp__github_comment nie napisze recenzji. `WebFetch` musi być wpisany
# DOKŁADNIE tak, bez nawiasu z domeną — akcja porównuje tę nazwę dosłownie.
name: Recenzent

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Nowy commit w tej samej gałęzi anuluje poprzednią recenzję. Tu oszczędność
# jest największa w całym repo: jedna recenzja to ~2,5 minuty, a poprawki lecą
# seriami — trzy pchnięcia pod rząd kosztowały trzy pełne recenzje, z których
# dwie i tak opisywały stan już nieaktualny. `quality.yml` miał ten mechanizm
# od początku, ten plik nie miał go wcale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recenzja:
    # Własny wykonawca na naszym serwerze (20.08). Recenzent zostaje na KAŻDYM
    # pchnięciu — to najlepsza kontrola, jaką mamy, a teraz jest za darmo.
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write
    steps:
      # Pelna historia, nie plytki klon: recenzent dwa razy sam zglaszal, ze nie
      # moze zweryfikowac historii (fetch-depth: 1 daje jeden commit, wiec
      # `git log`/`git diff` wzgledem bazy PR-a nie maja z czym pracowac).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PHP + vendor/ PRZED recenzja: recenzent ma URUCHAMIAC bramki (phpcs,
      # phpstan, skrypty zgodnosci), a nie czytac je i zgadywac wynik.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Zaleznosci QA (composer)
        run: composer install --no-interaction --no-progress

      # Znacznik czasu SPRZED recenzji. Bramka niżej liczy z niego, jak długo
      # recenzent naprawdę pracował — dwadzieścia sekund to nie recenzja.
      - name: Znacznik startu recenzji
        id: znacznik
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Recenzja PR
        id: recenzja
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Przeczytaj plik `.github/RECENZENT-BRIEFING.md` z tego repozytorium
            (jest w checkoucie) i wykonaj recenzję TEGO PR-a dokładnie według
            niego. Briefing jest jedynym źródłem zasad recenzji — nie zgaduj
            i nie zastępuj go własnymi przyzwyczajeniami. Jeśli pliku nie ma,
            powiedz to wprost i nie recenzuj na wyczucie.
          # 20.08: recenzent dostał ŻYWY STOS. W dzisiejszych recenzjach padło
          # 91 zdań „czego nie sprawdziłem", z czego 51 brzmiało „nie mam
          # uruchomionego WordPressa / nie zweryfikowałem paczki" — a WordPress
          # warsztatowy stoi na TEJ SAMEJ maszynie co ten wykonawca.
          # ⛔ Recenzent NIE dostaje dockera ani powłoki. Dostaje trzy nazwane
          # skrypty, każdy wyłącznie do odczytu: narzedzia-qa/stos.sh (zamknięta
          # lista operacji, twarde sprawdzanie argumentów, zero zapisu),
          # narzedzia-qa/paczka-zgodnosc.sh i testy/instrukcja-liczby-segregator.sh.
          # Wzorzec `:*` przy dwóch pierwszych przepuszcza dowolne argumenty —
          # dlatego to SKRYPT, nie akcja, odrzuca wszystko spoza białej listy;
          # pilnuje tego narzedzia-qa/stos-proba-kontrolna.sh (26 kontroli).
          # 21.08: recenzent ma URUCHAMIAC nasze testy, nie tylko je czytac.
          # Dotad pisal „nie uruchomilem" przy skryptach, ktore stoja w repo obok
          # recenzowanego kodu — to byla luka w tej liscie, nie ostroznosc.
          # Wpisane JAWNIE, po jednym, zamiast wzorca z gwiazdka: lista ma byc
          # do przeczytania w calosci i ma boles przy dopisywaniu, bo kazda
          # pozycja to zgoda na wykonanie kodu w checkoucie recenzenta.
          # ⛔ CELOWO POZA LISTA: testy/seed-demo.sh — jako jedyny pisze do
          #    WSPOLNEGO stosu warsztatowego (zamowienia demo w bazie), a nie do
          #    wlasnego checkoutu recenzenta. Reszta prob kontrolnych podmienia
          #    pliki wylacznie u siebie i przywraca je po sobie; checkout runnera
          #    jest jednorazowy i bez prawa zapisu do repo, wiec najgorsze, co
          #    moze zrobic przerwana proba, to zabrudzic wlasna kopie.
          # ⛔ TEZ POZA LISTA: dowod-z-paczki i dowod-aktualizacji wraz z ich
          #    probami — stawiaja kontenery i biegna kilkanascie minut, czyli
          #    dluzej niz cala recenzja. To kalibracja przed oddaniem, nie
          #    narzedzie recenzenta.
          # 23.08 (Dzidek): recenzent chodzi na Opus 5 — Fable 5 zostaje tylko dla koordynatorki (limit tygodniowy).
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Glob,Grep,LS,mcp__github_comment__update_claude_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Bash(composer install),Bash(composer install --no-interaction --no-progress),Bash(vendor/bin/phpcs),Bash(vendor/bin/phpcs:*),Bash(vendor/bin/phpstan:*),Bash(php -l:*),Bash(find:*),Bash(ln -s /root/praca/zlecenia/sklep-agentow/node_modules node_modules),Bash(bash testy/dokumentacja-zgodnosc.sh),Bash(bash testy/dokumentacja-zgodnosc-segregator.sh),Bash(bash testy/dokumentacja-zgodnosc-sklep.sh),Bash(bash testy/dokumentacja-zgodnosc-sklep-proba-kontrolna.sh),Bash(bash narzedzia-qa/k7-koniec.sh),Bash(bash narzedzia-qa/k7-koniec.sh:*),Bash(bash narzedzia-qa/k7-koniec-proba-kontrolna.sh),Bash(bash narzedzia-qa/mapa-licznik.sh audyt/sklep/material/06-mapa-polowania.md --tylko-licz),Bash(bash narzedzia-qa/mapa-licznik.sh audyt/sklep/material/06-mapa-polowania.md --sprawdz-zamrozenie),Bash(bash narzedzia-qa/sprawdz-manifest.sh),Bash(bash testy/blad-klucza-proba-kontrolna.sh),Bash(bash testy/ip-za-proxy-proba-kontrolna.sh),Bash(bash testy/kalibracja-mutantem.sh),Bash(bash testy/licznik-trafien-proba-kontrolna.sh),Bash(bash testy/nonce-proba-kontrolna.sh),Bash(bash testy/nota-zapisu-proba-kontrolna.sh),Bash(bash testy/pamiec-rozmowy-proba-kontrolna.sh),Bash(bash testy/przejecie-proba-kontrolna.sh),Bash(bash testy/pulapka-proba-kontrolna.sh),Bash(bash testy/rodo-proba-kontrolna.sh),Bash(bash testy/statystyki-proba-kontrolna.sh),Bash(bash testy/stronicowanie-proba-kontrolna.sh),Bash(bash testy/svg-proba-kontrolna.sh),Bash(bash testy/tokeny-koszt-proba-kontrolna.sh),Bash(bash testy/wskaznik-pisania-proba-kontrolna.sh),Bash(bash testy/wybor-modelu-proba-kontrolna.sh),Bash(bash testy/zgodnosc-proba-kontrolna.sh),Bash(bash narzedzia-qa/bramka-recenzji-proba-kontrolna.sh),Bash(bash narzedzia-qa/bramki-proba-kontrolna.sh),Bash(bash narzedzia-qa/bramka-poswiadczenia.sh),Bash(bash narzedzia-qa/bramka-poswiadczenia-proba-kontrolna.sh),Bash(bash narzedzia-qa/gitleaks-proba-kontrolna.sh),Bash(bash narzedzia-qa/paczka-zgodnosc-proba-kontrolna.sh),Bash(bash narzedzia-qa/stos-proba-kontrolna.sh),Bash(bash narzedzia-qa/test-php-proba-kontrolna.sh),Bash(bash narzedzia-qa/test-php.sh:*),Bash(bash narzedzia-qa/bramki.sh),Bash(bash narzedzia-qa/bramki.sh:*),Bash(bash narzedzia-qa/stos.sh:*),Bash(bash narzedzia-qa/paczka-zgodnosc.sh:*),Bash(bash testy/instrukcja-liczby-segregator.sh),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git rev-list:*),WebFetch"

      # Sonda błędu: pełny zapis wykonania CLI (stream NDJSON) — jedyne miejsce,
      # gdzie ląduje treść błędu przy „niemym zgonie" (log pokazuje tylko is_error).
      - name: Zachowaj pełny wynik CLI (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          # Dwie ścieżki: log naszego runa mówi RUNNER_TEMP, docs base-action /tmp —
          # bierzemy obie, upload-artifact wgra tę, która istnieje.
          # ⚠️ `runner.temp` zamiast wpisanego na sztywno /home/runner/work/_temp:
          # na własnym wykonawcy katalog roboczy leży gdzie indziej (zależnie od
          # miejsca instalacji runnera), więc sztywna ścieżka po cichu przestałaby
          # łapać artefakt — a to jedyna sonda przy „niemym zgonie".
          path: |
            ${{ runner.temp }}/claude-execution-output.json
            /tmp/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 7

      # ⛔ BRAMKA NA NIEMY ZGON. Akcja recenzenta potrafi skończyć się ZIELONO,
      # nie napisawszy ani słowa — zmierzone dwa razy 20.08, raz doprowadziło do
      # scalenia PR-a z otwartą uwagą KRYTYCZNĄ. Kryterium jest podwójne (czas
      # ORAZ komentarz), a PR ruszający pliki workflow dostaje JAWNY wyjątek,
      # bo tam akcja odmawia pracy z zasady. Szczegóły i próba kontrolna:
      # narzedzia-qa/bramka-recenzji.sh, narzedzia-qa/bramka-recenzji-proba-kontrolna.sh.
      #
      # `!cancelled()` zamiast `always()`: przebieg ubity przez concurrency
      # (nowe pchnięcie w tę samą gałąź) nie jest niemym zgonem, tylko naszą
      # własną oszczędnością — czerwień za to byłaby kłamstwem.
      - name: "Bramka: recenzja naprawde sie odbyla"
        if: ${{ !cancelled() }}
        env:
          RECENZJA_START: ${{ steps.znacznik.outputs.start }}
          PR_NUMER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TOKEN_GH: ${{ secrets.GITHUB_TOKEN }}
          PLIK_WYNIKU_CLI: ${{ runner.temp }}/claude-execution-output.json
        run: bash narzedzia-qa/bramka-recenzji.sh
