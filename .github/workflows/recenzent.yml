# Recenzent Claude na każdy PR (wzór: oficjalny przykład pr-review-comprehensive
# z anthropics/claude-code-action). Wymaga sekretu CLAUDE_CODE_OAUTH_TOKEN w repo.
#
# 2026-08-17: powrót do CZYSTEJ udokumentowanej konfiguracji po nocy 8 prób
# (historia: Issue #9). Zmiany względem nocnej wersji:
#  - usunięte obejścia (ręczny plik poświadczeń, pin CLI, env-dublet) — żadne
#    nie zmieniło objawu, a zaciemniają diagnozę,
#  - `show_full_output: true` — akcja DOMYŚLNIE ukrywa treść błędu w logu
#    (base-action sanitizeSdkOutput; „full output hidden for security"),
#  - permissions: dodane `actions: read` — bez niego 403 na GET /actions/runs
#    (nie zabija runa, ale wyłącza serwer MCP github_ci dla track_progress),
#  - krok upload-artifact (if: always()) zachowuje pełny wynik CLI — treść
#    błędu, której okrojony log nie pokazuje.
name: Recenzent

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  recenzja:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recenzja PR
        id: recenzja
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Jesteś recenzentem PR w projekcie „sklep-agentow" (sklep z produktami
            cyfrowymi wpinany w strony statyczne; zaplecze: Cloudflare Worker + D1 + R2;
            płatności: Stripe Checkout w trybie testowym). Pisz PO POLSKU.

            ZASADA DOWODU (najważniejsza): opis PR musi zawierać DOWÓD działania —
            wynik uruchomienia na żywych danych testowych (wyjście komendy, zapis
            z bazy, treść maila), nie deklarację „działa". Brak dowodu = uwaga
            KRYTYCZNA, niezależnie od jakości kodu.

            Czytaj zmiany na tle dokumentów repo: PLAN-PROJEKTU.md (sekcja 7 —
            bezpieczeństwo: podpis webhooka, idempotencja, cena z bazy, sekrety poza
            repo; sekcja 12 — kryteria GOTOWE) oraz ZROZUMIENIE.md (MUST NOT — rzeczy,
            których w tym projekcie ŚWIADOMIE nie budujemy; nie żądaj ich dodania).

            Na co patrzysz poza tym (sam decydujesz o reszcie):
            - poprawność: przypadki brzegowe, wyścigi (webhook 2×), padnięcie w połowie,
            - bezpieczeństwo: wszystko, co dotyka pieniędzy, plików i logowania admina,
            - prostota: czy nie budujemy więcej, niż wymaga zakres (MUST NOT!),
            - spójność z planem: implementacja może spełniać dokument, a łamać skutek —
              wskazuj takie miejsca.

            Uwagi konkretne, każda z wagą (KRYTYCZNA/WAŻNA/DROBNA), inline tam, gdzie
            dotyczą konkretnych linii. Nie chwal bez powodu. Po przeglądzie: krótkie
            podsumowanie z listą „czego NIE sprawdziłem".

      # Sonda błędu: pełny zapis wykonania CLI (stream NDJSON) — jedyne miejsce,
      # gdzie ląduje treść błędu przy „niemym zgonie" (log pokazuje tylko is_error).
      - name: Zachowaj pełny wynik CLI (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          # Dwie ścieżki: log naszego runa mówi RUNNER_TEMP, docs base-action /tmp —
          # bierzemy obie, upload-artifact wgra tę, która istnieje.
          path: |
            /home/runner/work/_temp/claude-execution-output.json
            /tmp/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 7
